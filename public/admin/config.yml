backend:
  name: github
  repo: erbekglobal/website
  branch: main
  base_url: https://auth.erbekglobal.com
  auth_endpoint: auth
local_backend: true
locale: tr
media_folder: public/uploads
public_folder: /uploads
collections:
  - name: company
    label: Şirket bilgileri
    files:
      - name: profile
        label: Şirket profili
        file: src/data/company.json
        format: json
        fields:
          - { label: Şirket adı, name: name, widget: string }
          - { label: Alan, name: sector, widget: string }
          - { label: Slogan, name: slogan, widget: string }
          - { label: Giriş metni, name: intro, widget: string }
          - { label: İletişim çağrısı, name: contactPrompt, widget: string }
          - label: Ortak metinler
            name: shared
            widget: object
            collapsed: true
            fields:
              - { label: İçeriğe geç bağlantısı, name: skipLink, widget: string }
              - { label: Menü erişilebilirlik etiketi, name: navigationLabel, widget: string }
              - { label: Marka ana sayfa etiketi, name: brandHomeLabel, widget: string }
              - { label: Telefon çağrısı düğmesi, name: calloutPhoneLabel, widget: string }
              - { label: İletişim çağrısı bağlantısı, name: calloutContactLabel, widget: string }
          - label: Menü bağlantıları
            name: navigation
            widget: object
            collapsed: true
            fields:
              - { label: Ana sayfa, name: home, widget: string }
              - { label: Projeler, name: projects, widget: string }
              - { label: Hakkımızda, name: about, widget: string }
              - { label: İletişim, name: contact, widget: string }
          - { label: Görünen telefon, name: phoneDisplay, widget: string }
          - { label: Telefon bağlantısı, name: phone, widget: string }
          - { label: WhatsApp bağlantısı, name: whatsapp, widget: string }
          - { label: Web sitesi, name: website, widget: string }
          - { label: E-posta, name: email, widget: string, required: false }
          - { label: Adres, name: address, widget: text, required: false }
          - { label: Hizmet bölgesi, name: workArea, widget: string, required: false }
          - label: Hizmetler
            name: services
            widget: list
            field: { label: Hizmet, name: item, widget: string }
  - name: pages
    label: Sayfalar
    files:
      - name: copy
        label: Sayfa metinleri
        file: src/data/pages.json
        format: json
        fields:
          - label: Ana sayfa
            name: home
            widget: object
            collapsed: true
            fields:
              - { label: Tarayıcı başlığı, name: seoTitle, widget: string }
              - { label: İletişim düğmesi, name: contactButton, widget: string }
              - { label: Hizmetler başlığı, name: servicesHeading, widget: string }
              - { label: Hizmetler açıklaması, name: servicesIntro, widget: text }
              - { label: Projeler bölümü başlığı, name: projectsHeading, widget: string }
              - { label: Projeler bağlantısı, name: projectsLink, widget: string }
          - label: Hakkımızda
            name: about
            widget: object
            collapsed: true
            fields:
              - { label: Tarayıcı başlığı, name: seoTitle, widget: string }
              - { label: Sayfa başlığı, name: pageHeading, widget: string }
              - label: İçerik bölümleri
                name: sections
                widget: list
                fields:
                  - { label: Bölüm başlığı, name: heading, widget: string }
                  - { label: Paragraflar, name: paragraphs, widget: list, field: { label: Paragraf, name: paragraph, widget: text } }
                  - { label: Liste öncesi metin, name: lead, widget: text, required: false }
                  - { label: Madde listesi, name: bullets, widget: list, required: false, field: { label: Madde, name: bullet, widget: string } }
                  - { label: Liste sonrası metin, name: closing, widget: text, required: false }
              - { label: İmza adından sonraki metin, name: signatureSuffix, widget: string }
              - { label: İmza sloganı, name: signatureTagline, widget: string }
          - label: İletişim
            name: contact
            widget: object
            collapsed: true
            fields:
              - { label: Tarayıcı başlığı, name: seoTitle, widget: string }
              - { label: Sayfa başlığı, name: pageHeading, widget: string }
              - { label: Telefon etiketi, name: phoneLabel, widget: string }
              - { label: WhatsApp düğmesi, name: whatsappButton, widget: string }
          - label: Projeler
            name: projects
            widget: object
            collapsed: true
            fields:
              - { label: Tarayıcı başlığı, name: seoTitle, widget: string }
              - { label: Sayfa başlığı, name: pageHeading, widget: string }
              - { label: Giriş metni, name: intro, widget: text }
              - { label: Proje listesi erişilebilirlik etiketi, name: ariaLabel, widget: string }
              - { label: Görsel yer tutucusu, name: imagePlaceholder, widget: string }
              - { label: Boş liste başlığı, name: emptyHeading, widget: string }
              - { label: Boş liste metni, name: emptyBody, widget: text }
              - { label: Geri bağlantısı, name: backLink, widget: string }
              - { label: Proje sayfası görsel yer tutucusu, name: detailImagePlaceholder, widget: string }
  - name: projects
    label: Projeler
    folder: src/content/projects
    create: true
    slug: '{{slug}}'
    extension: md
    format: frontmatter
    summary: '{{title}} · {{location}} · {{year}}'
    fields:
      - { label: Başlık, name: title, widget: string }
      - { label: Kısa açıklama, name: summary, widget: text }
      - { label: Konum, name: location, widget: string, required: false }
      - { label: Yıl, name: year, widget: number, required: false, value_type: int }
      - { label: Taslak, name: draft, widget: boolean, default: false }
      - label: Galeri
        name: gallery
        widget: list
        required: false
        fields:
          - { label: Görsel, name: image, widget: image }
          - { label: Alternatif metin, name: alt, widget: string }
      - label: İçerik
        name: body
        widget: markdown
        required: false
        editor_components: []
        buttons: [bold, italic, code, link, heading-two, heading-three, quote, bulleted-list, numbered-list]
